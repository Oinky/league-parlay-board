name: Weekly parlay recap

on:
  schedule:
    # 15:00 UTC ≈ 9am Central Standard Time. During Central Daylight Time
    # (roughly the first ~2 months of the NFL season) this fires closer to
    # 10am Central instead — GitHub Actions cron is always UTC, no DST awareness.
    - cron: "0 15 * * 2"
  workflow_dispatch: {}

jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/weekly-recap.js
        env:
          FIREBASE_PROJECT_ID: fantasy-parlay
          SLEEPER_LEAGUE_ID: "1389693561678606336"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
